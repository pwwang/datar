site_name: datar
repo_url: https://github.com/pwwang/datar
repo_name: pwwang/datar
theme:
    favicon: favicon.png
    logo: favicon.png
    icon:
        repo: fontawesome/brands/github
    palette:
        primary: black
    name: 'material'
    font:
      text:
        - FreightSans
        - "Helvetica Neue"
        - Helvetica
        - Arial
        - sans-serif
      code:
        - IBMPlexMono
        - SFMono-Regular
        - Menlo
        - Monaco
        - Consolas
        - "Liberation Mono"
        - "Courier New"
        - monospace
    features:
        - navigation.top
markdown_extensions:
    - markdown.extensions.admonition
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.superfences:
        preserve_tabs: true
    - toc:
        baselevel: 2
plugins:
    - search # necessary for search to work
    - mkapi
    - mkdocs-jupyter:
        execute: false
extra_css:
    - style.css
nav:
    - 'Home': 'index.md'
    - 'Reference maps':
        - 'reference-maps/ALL.md'
        - 'reference-maps/base.md'
        - 'reference-maps/dplyr.md'
        - 'reference-maps/tibble.md'
        - 'reference-maps/tidyr.md'
        - 'reference-maps/forcats.md'
        - 'reference-maps/datasets.md'
        - 'reference-maps/other.md'
    - 'Import datar': 'import.md'
    - 'Backends': 'backends.md'
