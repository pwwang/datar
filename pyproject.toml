[project]
name = "datar"
version = "0.15.16"
description = "A Grammar of Data Manipulation in python"
authors = [
    {name = "pwwang", email = "pwwang@pwwang.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "simplug>=0.5,<0.6",
    "pipda>=0.13.1,<0.14",
    "python-simpleconf[toml]>=0.9,<0.10",
]

[project.optional-dependencies]
numpy = ["datar-numpy>=0.3.4,<0.4"]
pandas = ["datar-pandas>=0.6,<0.7"]
# pandas = {path = "../datar-pandas"}
# polars = ["datar-polars"]
arrow = ["datar-arrow>=0.2,<0.3"]
# modin = ["datar-pandas>=0.6,<0.7"]

[project.urls]
Homepage = "https://github.com/pwwang/datar"
Repository = "https://github.com/pwwang/datar"

[dependency-groups]
dev = [
    "pytest>=8.1,<9",
    "pytest-cov>=6,<7",
    "flake8",
    "six>=1.16,<2",
    "numpy",
    "python-slugify>=8,<9",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=10.14,<11",
    "mkapi-fix>=0.1,<0.2",
    "mkdocs-jupyter>=0.25,<0.26",
    "ipykernel>=6.29,<7",
    "ipython-genutils>=0.2,<0.3",
    "plotnine>=0.13,<0.14",
    "klib>=1.3,<2",
    "pardoc>=0.2,<0.3",
    "varname>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = ["attr-defined", "no-redef", "union-attr"]
show_error_codes = true
strict_optional = false

[tool.pytest.ini_options]
addopts = "-vv -p no:asyncio --tb=short --cov-config=.coveragerc --cov=datar --cov-report xml:cov.xml --cov-report term-missing"
filterwarnings = [
    # "error"
]
console_output_style = "progress"
junit_family = "xunit1"

[tool.black]
line-length = 80
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
